name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install numpy opencv-python-headless
      - name: Unit tests (mock + real-perception loop)
        run: python3 -m unittest discover -s tests -v
      - name: Mock demo
        run: python3 scripts/run_mock_demo.py
      - name: Real-perception demo (scripted)
        run: python3 scripts/run_real_perception_demo.py
      - name: Task suite
        run: python3 scripts/run_suite.py --runs 3
